<!doctype html>
<html lang="fr" data-title-key="a.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bilel Hedhli · Admin</title>
<script src="/i18n.js"></script>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Tajawal:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  /* Admin: same red-and-white editorial look, tuned for daily use. */
  .wrap { max-width: 980px; margin: 0 auto; padding-block: 0 72px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 28px; }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-block: 22px; border-bottom: 1px solid var(--line); }
  .brand h1 { font-size: 24px; font-weight: 400; letter-spacing: 0.5em; text-transform: uppercase; }
  .brand h1 .b { font-size: 11px; letter-spacing: 0.3em; font-weight: 500; margin-inline-start: 14px; vertical-align: 4px; }
  .brand h1 .latin { letter-spacing: 0.5em; }
  .brand p { display: none; }
  .card { min-width: 0; }
  .card h2, .daybar h2, .cal-head h2 { font-size: clamp(28px, 4.5vw, 44px); font-weight: 300; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 18px; }

  .tabs { display: flex; gap: 28px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  .tab { border: 0; background: none; padding: 0 0 14px; cursor: pointer; font-size: 12px; font-weight: 500; letter-spacing: 0.24em; text-transform: uppercase; color: var(--red-soft); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: var(--red); }
  .tab[aria-selected="true"] { color: var(--red); border-bottom-color: var(--red); }

  .daybar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .daybar h2 { margin: 0 auto 0 0; }
  .daybar input { width: auto; }

  .appt { display: grid; grid-template-columns: 140px 1fr auto; gap: 18px; align-items: center; padding: 20px 0; border-top: 1px solid var(--line); }
  .appt .time { font-size: 26px; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .appt .time small { display: block; font-size: 12px; font-weight: 500; margin-top: 6px; letter-spacing: 0.04em; }
  .appt .who { min-width: 0; }
  .appt .who b { display: block; font-weight: 500; letter-spacing: 0.04em; }
  .appt .who span { color: var(--red-soft); font-size: 14px; overflow-wrap: anywhere; }
  .appt.is-done { opacity: 0.45; }
  .appt.is-done .time, .appt.is-done .who b { text-decoration: line-through; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  /* status by form, not colour: outline = waiting, solid = delayed, faded = done */
  .pill { display: inline-block; font-size: 10px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; padding: 3px 8px; margin-left: 10px; vertical-align: 2px; border: 1px solid var(--red); }
  .appt .who .pill.booked { background: var(--white); color: var(--red); }
  .appt .who .pill.delayed { background: var(--red); color: var(--white); }
  .appt .who .pill.done { background: var(--tint); color: var(--red); border-color: var(--tint); }
  .btn.danger { background: transparent; color: var(--red); border-color: transparent; text-decoration: underline; text-underline-offset: 4px; }
  .btn.danger:hover { border-color: var(--red); text-decoration: none; }
  .btn.danger.confirm { background: var(--red); color: var(--white); text-decoration: none; }
  .delay-pick { display: flex; gap: 6px; flex-wrap: wrap; }

  .counts { display: flex; gap: 26px; flex-wrap: wrap; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--red-soft); margin-bottom: 6px; }
  .counts b { color: var(--red); font-size: 22px; font-weight: 300; letter-spacing: 0; margin-right: 6px; font-variant-numeric: tabular-nums; }
  #closedNote { margin-bottom: 8px; }

  .cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .cal-head h2 { margin: 0 auto 0 0; }
  .grid7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0; border-left: 1px solid var(--line); border-top: 1px solid var(--line); }
  .wd { text-align: center; font-size: 10px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; padding: 10px 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .cell { aspect-ratio: 1 / 1; max-width: 100%; min-width: 0; border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--white); cursor: pointer; padding: 8px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; transition: background 0.2s; }
  .cell:hover { background: var(--tint); }
  .cell .n { font-size: 22px; font-weight: 300; line-height: 1; }
  .cell .c { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; }
  .cell.past { opacity: 0.4; }
  .cell.today .n { text-decoration: underline; text-underline-offset: 5px; }
  .cell.closed { background: repeating-linear-gradient(-45deg, var(--white) 0 7px, var(--tint) 7px 14px); }
  .cell[aria-pressed="true"] { background: var(--red); color: var(--white); }
  .cell.blank { background: var(--white); cursor: default; }
  .day-panel { margin-top: 20px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .day-panel p { margin: 0; }

  .hours-form { display: grid; gap: 28px; grid-template-columns: repeat(3, 1fr); }
  .weekdays { display: flex; gap: 6px; flex-wrap: wrap; }
  .weekdays label { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); padding: 8px 14px; cursor: pointer; }
  .weekdays label:has(input:checked) { background: var(--red); color: var(--white); border-color: var(--red); }
  .weekdays input { width: auto; accent-color: var(--red); }
  .preview { background: var(--tint); padding: 14px 16px; margin: 0; border-left: 2px solid var(--red); }

  .login { max-width: 380px; margin: 60px auto 0; width: 100%; display: grid; gap: 22px; }

  .lang-switch { display: flex; gap: 2px; }
  .lang-switch button { background: none; border: 0; color: var(--red); cursor: pointer; padding: 4px 6px; font-size: 11px; font-weight: 500; letter-spacing: 0.14em; opacity: 0.6; }
  .lang-switch button[lang="ar"] { font-family: "Tajawal", var(--font); font-size: 13px; letter-spacing: 0; }
  .lang-switch button:hover, .lang-switch button[aria-pressed="true"] { opacity: 1; text-decoration: underline; text-underline-offset: 6px; }
  html[lang="ar"] body { font-family: "Tajawal", var(--font); }
  html[lang="ar"] *:not(.latin):not(.latin *) { letter-spacing: 0 !important; }
  .latin { direction: ltr; }
  .flip { display: inline-block; }
  [dir="rtl"] .flip { transform: scaleX(-1); }
  .cell, .appt .time { text-align: start; }

  @media (max-width: 600px) {
    .appt { grid-template-columns: 130px 1fr; }
    .actions { grid-column: 1 / -1; justify-content: flex-start; }
    .hours-form { grid-template-columns: 1fr; }
    .cell { padding: 4px; }
    .cell .n { font-size: 16px; }
    .cell .c { font-size: 8px; letter-spacing: 0.04em; }
  }
</style>
</head>
<body>
<main class="wrap">
  <header class="brand">
    <div>
      <h1><span class="latin">Bilel</span><span class="b" data-i18n="a.admin">Admin</span></h1>
      <p>Your bookings, your calendar, your hours.</p>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <div class="lang-switch"></div>
      <a class="btn ghost small" href="/" data-i18n="a.viewSite">Voir le site</a>
      <button class="btn ghost small" id="logoutBtn" type="button" hidden data-i18n="a.logout">Se déconnecter</button>
    </div>
  </header>

  <!-- Login -->
  <form class="card login" id="loginForm">
    <h2 data-i18n="a.login">Espace barbier</h2>
    <label><span data-i18n="a.password">Mot de passe</span><input id="password" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit" data-i18n="a.signin">Se connecter</button>
    <p class="msg" id="loginErr" hidden></p>
  </form>

  <div id="app" hidden style="display:grid;gap:20px">
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="schedule" aria-selected="true" data-i18n="a.tab.schedule">Planning</button>
      <button class="tab" role="tab" data-tab="calendar" aria-selected="false" data-i18n="a.tab.calendar">Calendrier</button>
      <button class="tab" role="tab" data-tab="hours" aria-selected="false" data-i18n="a.tab.hours">Horaires</button>
    </nav>

    <!-- Schedule -->
    <section class="card" id="tab-schedule">
      <div class="daybar">
        <h2 id="schedTitle"></h2>
        <button class="btn ghost small" id="prevDay" type="button" data-i18n-aria="a.prevDay"><span class="flip">‹</span></button>
        <input type="date" id="schedDate">
        <button class="btn ghost small" id="nextDay" type="button" data-i18n-aria="a.nextDay"><span class="flip">›</span></button>
      </div>
      <div class="counts" id="counts"></div>
      <p class="msg" id="closedNote" hidden></p>
      <div id="apptList"></div>
    </section>

    <!-- Calendar -->
    <section class="card" id="tab-calendar" hidden>
      <div class="cal-head">
        <h2 id="calTitle"></h2>
        <button class="btn ghost small" id="prevMonth" type="button" data-i18n-aria="a.prevMonth"><span class="flip">‹</span></button>
        <button class="btn ghost small" id="nextMonth" type="button" data-i18n-aria="a.nextMonth"><span class="flip">›</span></button>
      </div>
      <div class="grid7" id="calGrid"></div>
      <div class="day-panel" id="dayPanel"></div>
    </section>

    <!-- Hours -->
    <section class="card" id="tab-hours" hidden>
      <h2 data-i18n="a.h.title">Horaires de réservation</h2>
      <form id="hoursForm" style="display:grid;gap:18px">
        <div class="hours-form">
          <label><span data-i18n="a.h.from"></span><input type="time" id="openTime" required></label>
          <label><span data-i18n="a.h.to"></span><input type="time" id="closeTime" required></label>
          <label><span data-i18n="a.h.length"></span>
            <select id="slotMinutes"></select>
          </label>
        </div>
        <div>
          <div style="font-size:14px;font-weight:600;margin-bottom:6px" data-i18n="a.h.weekly"></div>
          <div class="weekdays" id="weekdays"></div>
        </div>
        <p class="preview" id="hoursPreview"></p>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <button class="btn" type="submit" data-i18n="a.h.save">Enregistrer</button>
          <p class="msg" id="hoursMsg" hidden></p>
        </div>
      </form>
    </section>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const { t } = I18N;
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (s) => new Date(s + "T12:00:00");
const hhmmToMin = (s) => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
const timeLabel = (min) => `<span dir="ltr">${I18N.time(min)}</span>`;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let token = null;
try { token = localStorage.getItem("bilel_token"); } catch {}
let settings = null;
const view = { date: ymd(new Date()), month: new Date(new Date().getFullYear(), new Date().getMonth(), 1), calSel: null, armedDelete: null, delayFor: null };

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== "/api/login") { logout(); throw new Error(I18N.error(data.code)); }
  if (!res.ok) throw new Error(I18N.error(data.code));
  return data;
}

function isClosed(date) {
  return settings.closedDates.includes(date) || settings.weeklyOff.includes(parse(date).getDay());
}

/* ---------- login ---------- */
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("loginErr").hidden = true;
  try {
    const r = await api("/api/login", { method: "POST", body: { password: $("password").value } });
    token = r.token;
    try { localStorage.setItem("bilel_token", token); } catch {}
    start();
  } catch (err) { $("loginErr").textContent = err.message; $("loginErr").hidden = false; }
});
function logout() {
  token = null;
  try { localStorage.removeItem("bilel_token"); } catch {}
  $("app").hidden = true; $("logoutBtn").hidden = true; $("loginForm").hidden = false;
}
$("logoutBtn").onclick = logout;

/* ---------- tabs ---------- */
document.querySelectorAll(".tab").forEach((t) => (t.onclick = () => showTab(t.dataset.tab)));
function showTab(name) {
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.tab === name)));
  ["schedule", "calendar", "hours"].forEach((n) => ($("tab-" + n).hidden = n !== name));
  if (name === "schedule") renderSchedule();
  if (name === "calendar") renderCalendar();
  if (name === "hours") renderHours();
}

/* ---------- schedule ---------- */
$("schedDate").onchange = (e) => { if (e.target.value) { view.date = e.target.value; renderSchedule(); } };
$("prevDay").onclick = () => shiftDay(-1);
$("nextDay").onclick = () => shiftDay(1);
function shiftDay(n) { const d = parse(view.date); d.setDate(d.getDate() + n); view.date = ymd(d); renderSchedule(); }

async function renderSchedule() {
  const date = view.date;
  $("schedDate").value = date;
  const d = parse(date);
  const today = ymd(new Date());
  $("schedTitle").textContent = date === today ? t("a.today") : I18N.dateShort(date);
  const list = await api(`/api/admin/bookings?from=${date}&to=${date}`);
  const c = { booked: 0, done: 0, delayed: 0 };
  list.forEach((b) => c[b.status]++);
  $("counts").innerHTML = `<span><b>${list.length}</b> ${t("a.c.total")}</span><span><b>${c.booked}</b> ${t("a.c.waiting")}</span><span><b>${c.delayed}</b> ${t("a.c.delayed")}</span><span><b>${c.done}</b> ${t("a.c.done")}</span>`;
  const closedNote = $("closedNote");
  closedNote.hidden = !isClosed(date);
  closedNote.textContent = t("a.closedNote");
  const box = $("apptList");
  if (!list.length) { box.innerHTML = `<p class="empty">${t("a.noAppts")}</p>`; return; }
  box.innerHTML = list.map((b) => {
    const delayed = b.status === "delayed";
    const actions = view.delayFor === b.id
      ? `<span class="delay-pick">${[10, 15, 30, 45].map((m) => `<button class="btn small" data-act="delay" data-min="${m}" data-id="${b.id}"><span dir="ltr">+${m} min</span></button>`).join("")}<button class="btn ghost small" data-act="cancelDelay">${t("a.cancel")}</button></span>`
      : `${b.status !== "done" ? `<button class="btn small" data-act="done" data-id="${b.id}">${t("a.done")}</button>` : `<button class="btn ghost small" data-act="undo" data-id="${b.id}">${t("a.undo")}</button>`}
         ${b.status !== "done" ? `<button class="btn ghost small" data-act="pickDelay" data-id="${b.id}">${delayed ? t("a.changeDelay") : t("a.delay")}</button>` : ""}
         ${delayed ? `<button class="btn ghost small" data-act="undo" data-id="${b.id}">${t("a.onTime")}</button>` : ""}
         <button class="btn danger small ${view.armedDelete === b.id ? "confirm" : ""}" data-act="delete" data-id="${b.id}">${view.armedDelete === b.id ? t("a.confirmDelete") : t("a.delete")}</button>`;
    return `<div class="appt ${b.status === "done" ? "is-done" : ""}">
      <div class="time">${timeLabel(b.start)}${delayed ? `<small dir="ltr">+${b.delayMinutes} min → ${I18N.time(b.start + b.delayMinutes)}</small>` : ""}</div>
      <div class="who"><b>${esc(b.name)}<span class="pill ${b.status}">${t("a.pill." + b.status)}</span></b>
        <span>${b.service ? t("svc." + b.service) + " · " : ""}<span dir="ltr">${esc(b.phone)}</span></span></div>
      <div class="actions">${actions}</div>
    </div>`;
  }).join("");
}

$("apptList").addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const { act, id } = btn.dataset;
  try {
    if (act === "delete") {
      if (view.armedDelete !== id) { view.armedDelete = id; return renderSchedule(); }
      await api(`/api/admin/bookings/${id}`, { method: "DELETE" });
    } else if (act === "done") await api(`/api/admin/bookings/${id}`, { method: "PATCH", body: { status: "done" } });
    else if (act === "undo") await api(`/api/admin/bookings/${id}`, { method: "PATCH", body: { status: "booked" } });
    else if (act === "pickDelay") { view.delayFor = id; view.armedDelete = null; return renderSchedule(); }
    else if (act === "delay") await api(`/api/admin/bookings/${id}`, { method: "PATCH", body: { status: "delayed", delayMinutes: Number(btn.dataset.min) } });
    view.delayFor = null; view.armedDelete = null;
    renderSchedule();
  } catch (err) { alertMsg(err.message); }
});
function alertMsg(text) { const n = $("closedNote"); n.textContent = text; n.hidden = false; }

/* ---------- calendar ---------- */
$("prevMonth").onclick = () => { view.month.setMonth(view.month.getMonth() - 1); view.calSel = null; renderCalendar(); };
$("nextMonth").onclick = () => { view.month.setMonth(view.month.getMonth() + 1); view.calSel = null; renderCalendar(); };

async function renderCalendar() {
  const m = view.month;
  $("calTitle").textContent = I18N.monthYear(m);
  const first = ymd(m);
  const last = ymd(new Date(m.getFullYear(), m.getMonth() + 1, 0));
  const list = await api(`/api/admin/bookings?from=${first}&to=${last}`);
  const counts = {};
  list.forEach((b) => (counts[b.date] = (counts[b.date] || 0) + 1));
  const today = ymd(new Date());
  let html = [0, 1, 2, 3, 4, 5, 6].map((i) => `<div class="wd">${I18N.weekday(i, "short")}</div>`).join("");
  for (let i = 0; i < m.getDay(); i++) html += `<div class="cell blank"></div>`;
  const days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
  for (let n = 1; n <= days; n++) {
    const date = ymd(new Date(m.getFullYear(), m.getMonth(), n));
    const closed = isClosed(date);
    const cls = ["cell", closed && "closed", date < today && "past", date === today && "today"].filter(Boolean).join(" ");
    const label = closed ? t("a.cal.closed") : counts[date] ? t("a.cal.booked", { n: counts[date] }) : "";
    html += `<button type="button" class="${cls}" data-date="${date}" aria-pressed="${view.calSel === date}"><span class="n">${n}</span><span class="c">${label}</span></button>`;
  }
  $("calGrid").innerHTML = html;
  renderDayPanel(counts);
}

function renderDayPanel(counts) {
  const panel = $("dayPanel");
  const date = view.calSel;
  if (!date) { panel.innerHTML = `<p>${t("a.cal.hint")}</p>`; return; }
  const d = parse(date);
  const title = `<strong>${I18N.dateLong(date)}</strong>`;
  const n = counts[date] || 0;
  const weekly = settings.weeklyOff.includes(d.getDay());
  const closedDate = settings.closedDates.includes(date);
  let text, buttons = `<button class="btn ghost small" data-p="view">${t("a.seeSchedule")}</button>`;
  if (weekly) {
    text = t("a.weekly", { date: title, weekday: I18N.weekday(d.getDay(), "long") });
  } else if (closedDate) {
    text = t("a.dayClosed", { date: title });
    buttons += `<button class="btn small" data-p="open">${t("a.openDay")}</button>`;
  } else {
    text = n ? t("a.dayOpenN", { date: title, n }) : t("a.dayOpen", { date: title });
    buttons += `<button class="btn small" data-p="close">${t("a.closeDay")}</button>`;
  }
  panel.innerHTML = `<p>${text}</p><div style="display:flex;gap:8px;flex-wrap:wrap">${buttons}</div>`;
}

$("calGrid").addEventListener("click", (e) => {
  const c = e.target.closest(".cell[data-date]");
  if (!c) return;
  view.calSel = c.dataset.date;
  renderCalendar();
});
$("dayPanel").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-p]");
  if (!b) return;
  if (b.dataset.p === "view") { view.date = view.calSel; return showTab("schedule"); }
  settings = await api("/api/admin/closed", { method: "POST", body: { date: view.calSel, closed: b.dataset.p === "close" } });
  renderCalendar();
});

/* ---------- hours ---------- */
function renderHours() {
  $("openTime").value = settings.openTime;
  $("closeTime").value = settings.closeTime;
  $("slotMinutes").innerHTML = [15, 20, 30, 45, 60].map((n) => `<option value="${n}">${n === 60 ? t("a.h.hour") : t("a.h.min", { n })}</option>`).join("");
  $("slotMinutes").value = String(settings.slotMinutes);
  $("weekdays").innerHTML = [1, 2, 3, 4, 5, 6, 0].map((i) =>
    `<label><input type="checkbox" id="wd${i}" value="${i}" ${settings.weeklyOff.includes(i) ? "checked" : ""}>${I18N.weekday(i, "short")}</label>`).join("");
  $("hoursMsg").hidden = true;
  updatePreview();
}
function updatePreview() {
  const o = $("openTime").value, c = $("closeTime").value, slot = Number($("slotMinutes").value);
  if (!o || !c) return;
  const open = hhmmToMin(o);
  let close = hhmmToMin(c);
  const overnight = close <= open;
  if (overnight) close += 1440;
  const n = Math.floor((close - open) / slot);
  const lastStart = open + (n - 1) * slot;
  $("hoursPreview").innerHTML = n > 0
    ? t("a.h.preview", { open: timeLabel(open), close: timeLabel(close), overnight: overnight ? t("a.h.overnight") : "", n, last: timeLabel(lastStart) })
    : t("err.no_slots");
}
["openTime", "closeTime", "slotMinutes"].forEach((id) => $(id).addEventListener("input", updatePreview));

$("hoursForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = $("hoursMsg");
  const weeklyOff = [...document.querySelectorAll("#weekdays input:checked")].map((i) => Number(i.value));
  try {
    settings = await api("/api/admin/settings", { method: "PUT", body: {
      openTime: $("openTime").value, closeTime: $("closeTime").value, slotMinutes: Number($("slotMinutes").value), weeklyOff } });
    msg.className = "msg ok"; msg.textContent = t("a.h.saved");
  } catch (err) { msg.className = "msg"; msg.textContent = err.message; }
  msg.hidden = false;
});

/* ---------- start ---------- */
async function start() {
  try {
    settings = await api("/api/settings");
  } catch { return; }
  $("loginForm").hidden = true;
  $("app").hidden = false;
  $("logoutBtn").hidden = false;
  showTab("schedule");
}
I18N.apply();
I18N.onChange(() => {
  if (!settings || $("app").hidden) return;
  const tab = document.querySelector('.tab[aria-selected="true"]').dataset.tab;
  if (tab === "hours") {
    // keep unsaved edits while switching language
    const keep = { o: $("openTime").value, c: $("closeTime").value, s: $("slotMinutes").value, w: [...document.querySelectorAll("#weekdays input")].map((i) => i.checked) };
    renderHours();
    $("openTime").value = keep.o; $("closeTime").value = keep.c; $("slotMinutes").value = keep.s;
    document.querySelectorAll("#weekdays input").forEach((i, k) => (i.checked = keep.w[k]));
    updatePreview();
  } else showTab(tab);
});
if (token) start();
</script>
</body>
</html>
